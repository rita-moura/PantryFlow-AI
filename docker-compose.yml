services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pantryflow}
      POSTGRES_USER: ${POSTGRES_USER:-pantryflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pantryflow}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pantryflow_postgres_data:/var/lib/postgresql/data
volumes:
  pantryflow_postgres_data:
